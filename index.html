
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Gift Challenge</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #174b2c, #07110b 70%);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}
.card {
  width: 90%;
  max-width: 420px;
  background: #102019;
  border: 2px solid #9cff00;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 0 25px #5a9e23;
}
h1 { color: #aaff00; }
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 10px;
  box-sizing: border-box;
  font-size: 16px;
}
input {
  background: #07110b;
  border: 1px solid #668b53;
  color: white;
}
button {
  background: #aaff00;
  border: none;
  font-weight: bold;
  cursor: pointer;
}
#message { min-height: 25px; color: #ffd45a; }
#game { display: none; }
</style>
</head>
<body>

<div class="card">
  <h1>⚽ FOOTBALL GIFT CHALLENGE</h1>

  <div id="login">
    <p>Gib deinen Spielernamen ein:</p>
    <input id="name" maxlength="20" placeholder="Dein Spielername">
    <button id="join">Spiel betreten</button>
    <p id="message"></p>
  </div>

  <div id="game">
    <h2>Willkommen!</h2>
    <p id="welcome"></p>
    <p class="small">Dein eigener Spielraum wurde erstellt.</p>
    <h2>🎁 Dein Spielraum</h2>
    <p>Die Boxen kommen im nächsten Schritt.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getDatabase,
  ref,
  set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const joinButton = document.getElementById("join");
const nameInput = document.getElementById("name");
const message = document.getElementById("message");

joinButton.addEventListener("click", async () => {
  const playerName = nameInput.value.trim();

  if (!playerName) {
    message.textContent = "Bitte gib einen Spielernamen ein.";
    return;
  }

  joinButton.disabled = true;
  message.textContent = "Verbindung wird hergestellt ...";

  try {
    const result = await signInAnonymously(auth);
    const uid = result.user.uid;

    await set(ref(db, "players/" + uid), {
      name: playerName,
      joinedAt: Date.now()
    });

    document.getElementById("login").style.display = "none";
    document.getElementById("game").style.display = "block";
    document.getElementById("welcome").textContent =
      "Hallo " + playerName + "!";

  } catch (error) {
    console.error(error);
    message.textContent = "Fehler: " + error.message;
    joinButton.disabled = false;
  }
});
</script>

</body>
</html>
